groups:
  - name: nginx_query_templates
    interval: 30s
    rules:
      - record: template:nginx:requests_per_second
        expr: rate(nginx_http_requests_total[5m])

      - record: template:nginx:bytes_sent_per_second
        expr: rate(nginx_http_response_size_bytes_sum[5m])

      - record: template:nginx:bytes_received_per_second
        expr: rate(nginx_http_request_size_bytes_sum[5m])

      # Connections accepted per second
      - record: template:nginx:accepted_connections_per_second
        expr: rate(nginx_connections_accepted[5m])

      # Connection drop rate (accepted but not handled = drops)
      - record: template:nginx:dropped_connections_per_second
        expr: rate(nginx_connections_accepted[5m]) - rate(nginx_connections_handled[5m])

      # Current active connections
      - record: template:nginx:connections_active
        expr: nginx_connections_active

      # Keepalive (idle) connections
      - record: template:nginx:connections_waiting
        expr: nginx_connections_waiting

      # Connections currently reading request
      - record: template:nginx:connections_reading
        expr: nginx_connections_reading

      # Connections currently writing response
      - record: template:nginx:connections_writing
        expr: nginx_connections_writing

      # Ratio of idle connections to active (keepalive pressure indicator)
      - record: template:nginx:waiting_connections_ratio
        expr: nginx_connections_waiting / clamp_min(nginx_connections_active, 1)

      # Whether nginx exporter is reachable (1 = up, 0 = down)
      - record: template:nginx:up
        expr: nginx_up