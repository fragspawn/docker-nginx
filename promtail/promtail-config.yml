server:
  http_listen_port: 9088
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://127.0.0.1:9100/loki/api/v1/push
scrape_configs:
  - job_name: nginx_access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx_access
          service: nginx
          env: local
          __path__: /var/log/nginx/access.file.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<request>[^"]*)" (?P<status>\d{3}) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)" "(?P<http_x_forwarded_for>[^"]*)" host="(?P<host>[^"]*)" http_host="(?P<http_host>[^"]*)" xfwd_host="(?P<xfwd_host>[^"]*)" effective_host="(?P<effective_host>[^"]*)" upstream_target="(?P<destination>[^"]*)"'
      - labels:
          status:
          destination:
  - job_name: nginx_error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx_error
          service: nginx
          env: local
          __path__: /var/log/nginx/error.file.log
