server:
  http_listen_port: 9088

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://127.0.0.1:9100/loki/api/v1/push

scrape_configs:
  - job_name: nginx_access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx_access
          service: nginx
          env: local
          __path__: /var/log/nginx/access.file.log
    pipeline_stages:
      - regex:
          expression: '<remote_addr> - <remote_user> [<time_local>] "<request>" <status> <body_bytes_sent> "<http_referer>" "<http_user_agent>" "<http_x_forwarded_for>"'
      - labels:
          status:

  - job_name: nginx_error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx_error
          service: nginx
          env: local
          __path__: /var/log/nginx/error.file.log
