events {
  worker_connections 1024;
}

http {
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'host="$host" http_host="$http_host" xfwd_host="$http_x_forwarded_host" '
                  'effective_host="$effective_host" upstream_target="$upstream_target"';

  # Normalize host values and prefer X-Forwarded-Host when Host is missing/invalid.
  map $http_host $normalized_host {
    default $http_host;
    "~^(?<h>[^:]+)" $h;
  }

  map $http_x_forwarded_host $normalized_x_forwarded_host {
    default $http_x_forwarded_host;
    "~^(?<h>[^,: ]+)" $h;
  }

  map $normalized_host $effective_host {
    default $normalized_host;
    "" $normalized_x_forwarded_host;
    "-" $normalized_x_forwarded_host;
  }

  map $effective_host $upstream_target {
    default "";
    ~*^logs\.staginig\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:9000;
    ~*^stats\.staginig\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:9090;
    ~*^komodo\.staginig\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:9120;
    ~*^moodle\.staginig\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:7080;
    ~*^simshop\.staginig\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:7070;\
    ~*^api\.simshop\.staginig\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:7060;\
  }

  error_log /var/log/nginx/error.file.log warn;
  access_log /var/log/nginx/access.file.log main;

  server {
    listen 80 default_server;
    server_name _;

    location = /healthcheck {
      return 200 'ok\n';
      add_header Content-Type text/plain;
    }

    location / {
      if ($upstream_target = "") {
        return 404 'unknown host\n';
      }

      proxy_pass $upstream_target;
      proxy_set_header Host $effective_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 127.0.0.1:9080;

    location /nginx_status {
      stub_status;
      allow 127.0.0.1;
      deny all;
    }
  }
}
