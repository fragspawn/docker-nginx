events {
  worker_connections 1024;
}

http {
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'host="$host" http_host="$http_host" xfwd_host="$http_x_forwarded_host" '
                  'effective_host="$effective_host" upstream_target="$upstream_target"';

  # Normalize host values and prefer X-Forwarded-Host when Host is missing/invalid.
  map $http_host $normalized_host {
    default $http_host;
    "~^(?<h>[^:]+)" $h;
  }

  map $http_x_forwarded_host $normalized_x_forwarded_host {
    default $http_x_forwarded_host;
    "~^(?<h>[^,: ]+)" $h;
  }

  map $normalized_host $effective_host {
    default $normalized_host;
    "" $normalized_x_forwarded_host;
    "-" $normalized_x_forwarded_host;
  }

  map $effective_host $upstream_target {
    default "";
    ~*^logs\.staging\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:9000;
    ~*^stats\.staging\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:9090;
    ~*^komodo\.staging\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:9120;
    ~*^moodle\.staging\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:7080;
    ~*^simshop\.staging\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:7070;
    ~*^api\.staging\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:7060;
    ~*^auth\.staging\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:7050;
    ~*^wut\.staging\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:7040;
    ~*^wutapi\.staging\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:7030;
    ~*^regression.staging\.csds\.qld\.edu\.au\.?$ http://127.0.0.1:7020;
  }

  map $effective_host $auth_required {
    default "";
    ~*^logs\.staging\.csds\.qld\.edu\.au\.?$ "Staging Admin Area";
    ~*^stats\.staging\.csds\.qld\.edu\.au\.?$ "Staging Admin Area";
    ~*^regression\.staging\.csds\.qld\.edu\.au\.?$ "Staging Admin Area";
  }

  # Trust the AWS ALB to provide the real client IP via X-Forwarded-For.
  # Replace with your ALB's subnet(s) or use the AWS-managed prefix list range.
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  error_log /var/log/nginx/error.file.log warn;
  access_log /var/log/nginx/access.file.log main;

  server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 512M;
    proxy_read_timeout 300s;
    proxy_redirect off;

    location = /healthcheck {
      return 200 'ok\n';
      add_header Content-Type text/plain;
    }

    location / {
      #auth_basic $auth_required;
      #auth_basic_user_file /etc/nginx/.htpasswd;

      if ($upstream_target = "") {
        return 404 'unknown host\n';
      }

      proxy_pass $upstream_target;
      proxy_set_header Host $effective_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-Port $http_x_forwarded_port;

      proxy_pass_request_headers on;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_http_version 1.1;
    }
  }

  server {
    listen 127.0.0.1:9080;
    location /nginx_status {
      stub_status;
      allow 127.0.0.1;
      deny all;
    }
  }
}
