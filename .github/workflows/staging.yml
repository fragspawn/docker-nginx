name: Staging Webhook

on:
  pull_request:
    types: [closed]
    branches:
      - staging

jobs:
  on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Send webhook to Komodo staging
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ secrets.KOMODO_WEBHOOK_SECRET }}" \
            -d '{
              "event": "push_to_staging",
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "ref_name": "${{ github.ref_name }}",
              "sha": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "head_commit_message": "${{ github.event.head_commit.message }}"
            }' \
            "${{ secrets.KOMODO_PULL }}"
