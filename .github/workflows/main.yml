on:
  push:
    branches:
      - Main
jobs:
  webhook-job:
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{"event": "build_complete", "status": "success"}' \
          ${{ secrets.WEBHOOK_URL }}
